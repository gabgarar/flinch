site_name: flinch
site_description: Do solar flares contaminate the radial-velocity detection of Earth analogues? Solar flares in Sun-as-a-star radial velocities from NEID and HARPS-N
site_author: Gabriel García
site_url: https://gabgarar.github.io/flinch/
repo_url: https://github.com/gabgarar/flinch
repo_name: gabgarar/flinch
docs_dir: docs/web
site_dir: site
copyright: Copyright &copy; 2026 Gabriel García. BSD 3-Clause license.

theme:
  name: material
  language: en
  icon:
    logo: material/white-balance-sunny
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Data:
      - GOES flares: data/goes.md
      - NEID velocities: data/neid-velocities.md
      - NEID spectra: data/neid-spectra.md
      - HARPS-N velocities: data/harpsn.md
  - Method: method.md
  - Results: results.md
  - Reproducing the paper: reproduce.md
  - API reference:
      - Data: api/data.md
      - Velocity analysis: api/velocity.md
      - Spectra: api/spectra.md
      - Reproduction: api/reproduction.md
  - References: references.md
  - Cite: cite.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          site_description: ¿Contaminan las fulguraciones solares la detección de análogos terrestres por velocidad radial? Fulguraciones solares en las velocidades radiales del Sol como estrella de NEID y HARPS-N
          nav_translations:
            Home: Inicio
            Getting started: Primeros pasos
            Data: Datos
            GOES flares: Fulguraciones de GOES
            NEID velocities: Velocidades de NEID
            NEID spectra: Espectros de NEID
            HARPS-N velocities: Velocidades de HARPS-N
            Method: Método
            Results: Resultados
            Reproducing the paper: Reproducir el artículo
            Reproduction: Reproducción
            API reference: Referencia de la API
            Velocity analysis: Análisis de velocidad
            Spectra: Espectros
            References: Referencias
            Cite: Citar
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            heading_level: 2
            members_order: source
            filters: ["!^_"]
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
