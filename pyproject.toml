[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
# "flinch" is taken on PyPI by an unrelated package, hence the distribution name.
name = "flinch-rv"
version = "1.0.0"
description = "Solar flares in the radial velocity of the Sun observed as a star (NEID, HARPS-N): do they contaminate the detection of Earth analogues?"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel García" }]
keywords = ["solar physics", "solar flares", "radial velocity", "Sun-as-a-star", "exoplanets", "Earth analogues", "stellar activity", "NEID", "HARPS-N", "GOES", "astronomy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "h5py>=3.8",
]

[project.optional-dependencies]
analysis = ["scipy>=1.10", "matplotlib>=3.7", "astropy>=5.3"]
notebooks = ["ipykernel"]
dev = ["pytest>=7"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25", "mkdocs-static-i18n>=1.2"]  # documentation site (mkdocs serve)

[project.urls]
Homepage = "https://github.com/gabgarar/flinch"
Documentation = "https://gabgarar.github.io/flinch/"
Issues = "https://github.com/gabgarar/flinch/issues"

[tool.setuptools.packages.find]
include = ["flinch*"]

[tool.setuptools.package-data]
flinch = ["reference/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: needs the NEID and NOAA archives; run with  pytest -m network",
    "needs_data: uses the real downloads in data/; skipped when they are missing",
]
